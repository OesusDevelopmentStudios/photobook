#
# Builds pictorio and runs all its tests, the end-to-end tests against a real pictorio-db server too, inside
# the KDE SDK that the Flatpak is built with (tests/run_in_flatpak_sdk.sh, which also runs locally).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11  # flatpak-builder and the KDE SDK 6.11
      options: --privileged  # flatpak-builder's sandbox needs it
    steps:
      - uses: actions/checkout@v7
        with:
          path: pictorio

      # The server the end-to-end tests run against, at a fixed commit, so a server change never breaks the
      # app's CI unannounced. Move it on when the app needs a newer server.
      - uses: actions/checkout@v7
        with:
          repository: OesusDevelopmentStudios/pictorio-db
          ref: 199a4c06e71c68fa089805da174761d6f7222e16
          path: pictorio-db

      # flatpak-builder needs a session bus; the container has none, nor the machine-id to start one itself.
      - run: dbus-run-session -- pictorio/tests/run_in_flatpak_sdk.sh
